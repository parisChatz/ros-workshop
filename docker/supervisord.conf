[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvnc]
priority=10
user=ros
environment=HOME="/home/ros",USER="ros"
command=/usr/bin/Xtigervnc :1 -geometry %(ENV_VNC_GEOMETRY)s -depth 24 -rfbport 5901 -localhost yes -SecurityTypes None -AlwaysShared -ac
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:desktop]
priority=20
user=ros
environment=HOME="/home/ros",USER="ros",DISPLAY=":1"
command=/bin/bash -c 'until [ -e /tmp/.X11-unix/X1 ]; do sleep 0.3; done; exec dbus-launch --exit-with-session startxfce4'
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
priority=30
user=ros
command=/usr/bin/websockify --web /usr/share/novnc 6080 localhost:5901
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:code-server]
priority=40
user=ros
environment=HOME="/home/ros",USER="ros"
command=/usr/bin/code-server --auth none --bind-addr 0.0.0.0:8080 --disable-telemetry --disable-update-check /home/ros/workspace
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
